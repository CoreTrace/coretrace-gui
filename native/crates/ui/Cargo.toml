[package]
name = "coretrace-ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
floem = "0.2.0"
coretrace-ipc = { path = "../ipc" }
tree-sitter = "0.26.12"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
rfd = "0.17.2"
coretrace-core = { version = "0.1.0", path = "../core" }
coretrace-extensions = { version = "0.1.0", path = "../extensions" }
coretrace-ctrace = { version = "0.1.0", path = "../ctrace" }
coretrace-lsp = { version = "0.1.0", path = "../lsp" }
coretrace-llm = { version = "0.1.0", path = "../llm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
