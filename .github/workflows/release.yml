name: CoreTrace Desktop
on:
  push:
    branches: [master, develop, feat/tauri-react-desktop]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify release versions
        run: node scripts/check-desktop-version.cjs
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build desktop
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: npm run tauri -- build --no-bundle
      - name: Build release installers
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: coretrace-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/coretrace-desktop.exe
            src-tauri/target/release/coretrace-desktop
            src-tauri/target/release/bundle/**
          if-no-files-found: error
